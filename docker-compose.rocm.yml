services:
  vllm:
    image: vllm/vllm-openai:latest
    ports:
      - "8001:8001"
    environment:
      HF_HOME: /models
      VLLM_USE_ROCM: "1"
    volumes:
      - model_cache:/models
    command: >
      --model Qwen/Qwen3-8B
      --dtype auto
      --max-model-len 8192
      --gpu-memory-utilization 0.9
      --port 8001
      --host 0.0.0.0
    deploy:
      resources:
        reservations:
          devices:
            - driver: amd
              count: all
              capabilities: [gpu]

  qwen-vl:
    image: vllm/vllm-openai:latest
    ports:
      - "8002:8002"
    environment:
      HF_HOME: /models
      VLLM_USE_ROCM: "1"
    volumes:
      - model_cache:/models
    command: >
      --model Qwen/Qwen2.5-VL-7B-Instruct
      --dtype auto
      --max-model-len 4096
      --gpu-memory-utilization 0.9
      --port 8002
      --host 0.0.0.0
      --trust-remote-code
    deploy:
      resources:
        reservations:
          devices:
            - driver: amd
              count: all
              capabilities: [gpu]

volumes:
  model_cache:
